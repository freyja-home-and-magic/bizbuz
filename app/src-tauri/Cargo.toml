[package]
name = "bizbuz"
version = "0.4.1"
description = "BizBuz — create your digital business card and share it"
authors = ["Freyja - Love and Magic"]
edition = "2021"

[lib]
name = "bizbuz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs reads bases.json to pick this build's base override.
serde_json = "1.0"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-share-sheet = { path = "tauri-plugin-share-sheet" }
tauri-plugin-app-group = { path = "tauri-plugin-app-group" }
tauri-plugin-identity-keychain = { path = "tauri-plugin-identity-keychain" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bdo-rs = { path = "../../../allyabase/deployment/bdo/src/client/rust/bdo-rs" }
sessionless = "0.1.1"
hex = "0.4"
